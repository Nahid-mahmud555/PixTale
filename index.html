<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixTale — Retro Photo Story Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600&family=Cinzel:wght@600;700&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col overflow-hidden retro-body">

  <!-- VHS SCANLINE OVERLAY -->
  <div class="scanlines"></div>
  <div class="vhs-grain"></div>

  <!-- TOP NAVBAR -->
  <header class="h-16 md:h-20 border-b-4 border-black bg-retro-cream px-4 md:px-6 flex items-center justify-between shrink-0 z-30 relative">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 md:w-12 md:h-12 rounded-none bg-retro-red border-4 border-black flex items-center justify-center text-white font-black text-base md:text-xl shadow-retro">
        PT
      </div>
      <div>
        <h1 class="font-retro-display text-lg md:text-2xl leading-none tracking-tight text-black">PIXTALE</h1>
        <p class="text-[10px] md:text-xs text-black/70 mt-1 font-mono-retro hidden sm:block">★ 50/50 PHOTO STORY BUILDER ★</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-2 md:space-x-3">
      <button id="soundToggleBtn" class="retro-btn retro-btn-yellow">
        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        <span class="hidden sm:inline">SOUND ON</span>
      </button>

      <button id="clearAllBtn" class="retro-btn retro-btn-red">
        <i class="fa-solid fa-trash-can"></i>
        <span class="hidden sm:inline">CLEAR</span>
      </button>

      <button id="startPresentationBtn" class="retro-btn retro-btn-green">
        <i class="fa-solid fa-play"></i>
        <span>PLAY</span>
      </button>
    </div>
  </header>

  <!-- MOBILE TABS -->
  <div class="flex lg:hidden bg-retro-cream border-b-4 border-black shrink-0">
    <button id="tabPreviewBtn" class="flex-1 py-3 text-xs font-mono-retro font-bold text-black bg-retro-yellow border-r-2 border-black">
      <i class="fa-solid fa-eye mr-1.5"></i>PREVIEW
    </button>
    <button id="tabEditBtn" class="flex-1 py-3 text-xs font-mono-retro font-bold text-black/60 border-r-2 border-black">
      <i class="fa-solid fa-pen-to-square mr-1.5"></i>EDIT
    </button>
    <button id="tabSlidesBtn" class="flex-1 py-3 text-xs font-mono-retro font-bold text-black/60">
      <i class="fa-solid fa-images mr-1.5"></i>SLIDES (<span id="mobileSlideCount">0</span>)
    </button>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- LEFT SIDEBAR: SLIDES LIST -->
    <aside id="slidesSidebar" class="hidden lg:flex w-72 lg:w-80 border-r-4 border-black bg-retro-cream flex-col shrink-0 absolute lg:relative inset-0 z-20">
      <div class="p-4 border-b-4 border-black bg-retro-pink">
        <label for="imageFileInput" class="group relative flex flex-col items-center justify-center p-5 border-4 border-dashed border-black bg-white hover:bg-retro-yellow transition cursor-pointer text-center shadow-retro">
          <input type="file" id="imageFileInput" accept="image/*" multiple class="hidden">
          <div class="w-10 h-10 rounded-none bg-retro-red border-3 border-black text-white flex items-center justify-center mb-2 group-hover:scale-110 transition">
            <i class="fa-solid fa-cloud-arrow-up text-base"></i>
          </div>
          <span class="text-xs font-mono-retro font-bold text-black uppercase">Upload Photos</span>
          <span class="text-[10px] text-black/60 mt-1 font-mono-retro">Click to select</span>
        </label>
      </div>

      <div class="p-3 pb-1 flex items-center justify-between text-xs font-mono-retro font-bold text-black bg-retro-cream border-b-2 border-black">
        <span>▸ SLIDES (<span id="slideCountText">0</span>)</span>
      </div>

      <div id="slideListContainer" class="flex-1 overflow-y-auto p-3 space-y-2 bg-retro-cream">
        <div id="emptySlidesState" class="h-40 flex flex-col items-center justify-center text-center p-4 text-black/50 border-4 border-dashed border-black/40 bg-white/50">
          <i class="fa-regular fa-images text-2xl mb-2"></i>
          <p class="text-xs font-mono-retro">NO SLIDES YET</p>
        </div>
      </div>
    </aside>

    <!-- MIDDLE: CUSTOMIZER FORM -->
    <div id="customizerPanel" class="hidden lg:block w-full sm:w-80 lg:w-80 border-r-4 border-black bg-retro-cream overflow-y-auto p-4 md:p-5 space-y-5 shrink-0 absolute lg:relative inset-0 z-20">
      <div class="flex items-center justify-between pb-3 border-b-4 border-black">
        <h2 class="font-retro-display text-sm text-black flex items-center space-x-2">
          <i class="fa-solid fa-sliders"></i>
          <span>CUSTOMIZE</span>
        </h2>
        <span id="activeSlideLabel" class="text-[10px] px-2 py-1 bg-black text-retro-yellow font-mono-retro font-bold">NO SEL</span>
      </div>

      <div id="editorControlsWrapper" class="space-y-5 opacity-40 pointer-events-none transition">
        <div class="space-y-2">
          <label class="text-xs font-mono-retro font-bold text-black uppercase">▸ Bottom Canvas Text</label>
          <textarea id="textInput" rows="3" class="retro-input" placeholder="Type text here..."></textarea>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-mono-retro font-bold text-black uppercase">▸ Entrance Animation</label>
          <select id="animationSelect" class="retro-select">
            <option value="typewriter">Typewriter (Letter + Click)</option>
            <option value="fade">Letter Fade In</option>
            <option value="slide">Letter Slide Up</option>
            <option value="bounce">Letter Bounce</option>
            <option value="glow">Letter Glow</option>
          </select>
        </div>

        <div class="space-y-3 pt-3 border-t-4 border-black">
          <span class="text-[10px] font-mono-retro font-bold text-black uppercase tracking-wider block bg-retro-yellow px-2 py-1 border-2 border-black inline-block">TYPOGRAPHY</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">FONT</label>
              <select id="fontSelect" class="retro-select-sm">
                <option value="font-serif-elegant">Serif</option>
                <option value="font-sans-clean">Sans</option>
                <option value="font-handwriting">Handwriting</option>
                <option value="font-modern-display">Display</option>
                <option value="font-cinzel">Cinzel</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">SIZE</label>
              <select id="fontSizeSelect" class="retro-select-sm">
                <option value="text-lg md:text-xl">Small</option>
                <option value="text-xl md:text-2xl">Medium</option>
                <option value="text-2xl md:text-4xl" selected>Large</option>
                <option value="text-3xl md:text-5xl">XL</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">ALIGN</label>
              <div class="flex border-3 border-black bg-white">
                <button type="button" data-align="text-left" class="align-btn flex-1 py-1.5 text-center text-xs border-r-2 border-black hover:bg-retro-yellow text-black"><i class="fa-solid fa-align-left"></i></button>
                <button type="button" data-align="text-center" class="align-btn flex-1 py-1.5 text-center text-xs border-r-2 border-black hover:bg-retro-yellow text-black active bg-retro-yellow"><i class="fa-solid fa-align-center"></i></button>
                <button type="button" data-align="text-right" class="align-btn flex-1 py-1.5 text-center text-xs hover:bg-retro-yellow text-black"><i class="fa-solid fa-align-right"></i></button>
              </div>
            </div>
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">COLOR</label>
              <div class="flex items-center space-x-2 border-3 border-black bg-white p-1">
                <input type="color" id="textColorPicker" value="#1C1917" class="w-6 h-6 rounded-none cursor-pointer border-0 bg-transparent">
                <span id="textColorHex" class="text-[10px] text-black font-mono-retro font-bold">#1C1917</span>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-3 border-t-4 border-black">
          <span class="text-[10px] font-mono-retro font-bold text-black uppercase tracking-wider block bg-retro-pink px-2 py-1 border-2 border-black inline-block">TIMING</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">DURATION (S)</label>
              <input type="number" id="durationInput" min="2" max="60" value="5" class="retro-input-sm">
            </div>
            <div>
              <label class="text-[10px] text-black font-mono-retro font-bold block mb-1">PHOTO FIT</label>
              <select id="objectFitSelect" class="retro-select-sm">
                <option value="object-cover">Cover</option>
                <option value="object-contain">Contain</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ✅ NEW: CANVAS BACKGROUND COLOR PICKER -->
        <div class="space-y-3 pt-3 border-t-4 border-black">
          <span class="text-[10px] font-mono-retro font-bold text-black uppercase tracking-wider block bg-retro-green px-2 py-1 border-2 border-black inline-block">CANVAS BG</span>
          <div class="grid grid-cols-4 gap-2" id="canvasColorGrid">
            <!-- JS diye color swatch generate hobe -->
          </div>
        </div>

        <button id="replayAnimBtn" class="retro-btn retro-btn-pink w-full">
          <i class="fa-solid fa-rotate-right"></i>
          <span>REPLAY ANIMATION</span>
        </button>
      </div>
    </div>

    <!-- RIGHT: LIVE REAL-TIME PREVIEW CANVAS -->
    <main id="previewPanel" class="flex-1 flex flex-col items-center justify-center p-3 md:p-6 bg-retro-navy relative overflow-hidden">
      <div class="text-[10px] md:text-xs text-retro-yellow font-mono-retro font-bold absolute top-3 left-5 flex items-center space-x-2 z-10 bg-black px-3 py-1 border-2 border-retro-yellow">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
        <span>● LIVE PREVIEW</span>
      </div>

      <div class="w-full max-w-2xl h-[75vh] max-h-[600px] bg-black border-4 border-black shadow-retro-lg flex flex-col relative overflow-hidden">
        <div class="h-1/2 w-full photo-frame-bg relative overflow-hidden flex items-center justify-center border-b-4 border-black">
          <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover object-center hidden transition-all duration-300">
          <div id="previewImagePlaceholder" class="flex flex-col items-center justify-center text-retro-yellow/60 font-mono-retro">
            <i class="fa-regular fa-image text-3xl mb-2"></i>
            <span class="text-xs">▶ TOP PHOTO SCREEN</span>
          </div>
        </div>

        <div class="h-1/2 w-full creamy-canvas p-4 md:p-8 flex flex-col justify-center items-center relative overflow-hidden">
          <div id="previewTextContainer" class="w-full max-w-xl text-center text-black font-serif-elegant text-xl md:text-3xl leading-relaxed tracking-tight">
            <span class="text-black/40 italic text-sm font-mono-retro">SELECT A SLIDE...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- FULLSCREEN PRESENTATION MODAL -->
  <div id="presentationModal" class="fixed inset-0 bg-black z-50 hidden flex-col">
    <div class="absolute top-0 left-0 right-0 p-3 md:p-5 flex items-center justify-between z-20 bg-gradient-to-b from-black to-transparent">
      <div class="flex items-center space-x-3 text-white">
        <span id="playerSlideCounter" class="text-xs font-mono-retro font-bold bg-retro-yellow text-black px-3 py-1.5 border-2 border-black">SLIDE 1 / 1</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="playerPauseBtn" class="w-10 h-10 border-3 border-white bg-black text-white flex items-center justify-center hover:bg-retro-yellow hover:text-black transition">
          <i class="fa-solid fa-pause text-xs"></i>
        </button>
        <button id="closePresentationBtn" class="w-10 h-10 border-3 border-white bg-black text-white flex items-center justify-center hover:bg-retro-red transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <div class="w-full h-full flex flex-col">
      <div class="h-1/2 w-full photo-frame-bg relative flex items-center justify-center overflow-hidden border-b-4 border-black">
        <img id="playerImage" src="" alt="Presentation Photo" class="w-full h-full object-cover object-center">
      </div>

      <div class="h-1/2 w-full creamy-canvas p-6 md:p-12 flex flex-col justify-center items-center relative overflow-hidden">
        <div id="playerTextContainer" class="w-full max-w-3xl text-center"></div>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 h-3 bg-black border-t-4 border-black">
      <div id="presentationProgressBar" class="h-full bg-retro-red transition-all duration-100 ease-linear" style="width: 0%;"></div>
    </div>

    <button id="prevSlideBtn" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 border-3 border-white bg-black text-white flex items-center justify-center hover:bg-retro-yellow hover:text-black transition">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="nextSlideBtn" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 border-3 border-white bg-black text-white flex items-center justify-center hover:bg-retro-yellow hover:text-black transition">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
