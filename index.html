<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixTale - 50/50 Photo Presentation Builder with Sound</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-100">

  <!-- TOP NAVBAR -->
  <header class="h-14 md:h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-4 md:px-6 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black text-base md:text-xl shadow-lg shadow-amber-500/20">
        PT
      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base leading-none tracking-tight text-slate-100">PixTale[cite: 1]</h1>
        <p class="text-[10px] md:text-xs text-slate-400 mt-0.5 hidden sm:block">50/50 Photo Presentation Builder with Sound[cite: 1]</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-2 md:space-x-3">
      <button id="soundToggleBtn" class="p-2 md:px-3 md:py-1.5 text-xs font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 rounded-lg transition flex items-center space-x-1.5">
        <i id="soundIcon" class="fa-solid fa-volume-high text-amber-400"></i>
        <span class="hidden sm:inline">Sound ON</span>
      </button>

      <button id="clearAllBtn" class="p-2 md:px-3 md:py-1.5 text-xs font-medium text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition flex items-center space-x-1.5">
        <i class="fa-solid fa-trash-can"></i>
        <span class="hidden sm:inline">Clear</span>
      </button>

      <button id="startPresentationBtn" class="px-3 py-1.5 md:px-5 md:py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-semibold text-xs md:text-sm rounded-xl shadow-lg shadow-amber-500/20 flex items-center space-x-1.5 md:space-x-2 transition transform active:scale-95">
        <i class="fa-solid fa-play"></i>
        <span>Play</span>
      </button>
    </div>
  </header>

  <!-- MOBILE TABS -->
  <div class="flex lg:hidden bg-slate-900 border-b border-slate-800 shrink-0">
    <button id="tabPreviewBtn" class="flex-1 py-2.5 text-xs font-medium text-amber-400 border-b-2 border-amber-500 text-center">
      <i class="fa-solid fa-eye mr-1.5"></i>Live Preview
    </button>
    <button id="tabEditBtn" class="flex-1 py-2.5 text-xs font-medium text-slate-400 text-center">
      <i class="fa-solid fa-pen-to-square mr-1.5"></i>Customizer
    </button>
    <button id="tabSlidesBtn" class="flex-1 py-2.5 text-xs font-medium text-slate-400 text-center">
      <i class="fa-solid fa-images mr-1.5"></i>Slides (<span id="mobileSlideCount">0</span>)
    </button>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- LEFT SIDEBAR: SLIDES LIST -->
    <aside id="slidesSidebar" class="hidden lg:flex w-72 lg:w-80 border-r border-slate-800 bg-slate-900 flex-col shrink-0 absolute lg:relative inset-0 z-20">
      <div class="p-4 border-b border-slate-800">
        <label for="imageFileInput" class="group relative flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-700 hover:border-amber-500/70 rounded-2xl bg-slate-950/40 hover:bg-slate-800/40 transition cursor-pointer text-center">
          <input type="file" id="imageFileInput" accept="image/*" multiple class="hidden">
          <div class="w-9 h-9 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center mb-1.5 group-hover:scale-110 transition">
            <i class="fa-solid fa-cloud-arrow-up text-base"></i>
          </div>
          <span class="text-xs font-semibold text-slate-200">Upload Photos</span>
          <span class="text-[10px] text-slate-500 mt-0.5">Select image files</span>
        </label>
      </div>

      <div class="p-3 pb-1 flex items-center justify-between text-xs text-slate-400 font-medium">
        <span>SLIDES (<span id="slideCountText">0</span>)</span>
      </div>

      <div id="slideListContainer" class="flex-1 overflow-y-auto p-3 space-y-2">
        <div id="emptySlidesState" class="h-40 flex flex-col items-center justify-center text-center p-4 text-slate-500 border border-dashed border-slate-800 rounded-xl">
          <i class="fa-regular fa-images text-xl mb-1.5 opacity-50"></i>
          <p class="text-xs">No slides added yet</p>
        </div>
      </div>
    </aside>

    <!-- MIDDLE: CUSTOMIZER FORM -->
    <div id="customizerPanel" class="hidden lg:block w-full sm:w-80 lg:w-80 border-r border-slate-800 bg-slate-900/60 overflow-y-auto p-4 md:p-5 space-y-5 shrink-0 absolute lg:relative inset-0 z-20">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h2 class="font-bold text-xs md:text-sm text-slate-200 flex items-center space-x-2">
          <i class="fa-solid fa-sliders text-amber-400"></i>
          <span>Customize Slide</span>
        </h2>
        <span id="activeSlideLabel" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-amber-400 font-mono">No Selection</span>
      </div>

      <div id="editorControlsWrapper" class="space-y-4 opacity-40 pointer-events-none transition">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300">Bottom Canvas Text</label>
          <textarea id="textInput" rows="3" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl p-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-amber-500 transition resize-y font-sans" placeholder="Type text here..."></textarea>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-300">Entrance Animation</label>
          <select id="animationSelect" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none">
            <option value="typewriter">Typewriter (With Click Sound)</option>
            <option value="fade">Word Fade In</option>
            <option value="slide">Word Slide Up</option>
            <option value="bounce">Word Soft Bounce</option>
            <option value="glow">Glow & Blur Reveal</option>
          </select>
        </div>

        <div class="space-y-2.5 pt-2 border-t border-slate-800">
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Typography</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Font Family</label>
              <select id="fontSelect" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-lg p-1.5 text-xs text-slate-200">
                <option value="font-serif-elegant">Serif Elegant</option>
                <option value="font-sans-clean">Sans Clean</option>
                <option value="font-handwriting">Handwriting</option>
                <option value="font-modern-display">Modern Display</option>
                <option value="font-cinzel">Classic Cinzel</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Font Size</label>
              <select id="fontSizeSelect" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-lg p-1.5 text-xs text-slate-200">
                <option value="text-lg md:text-xl">Small</option>
                <option value="text-xl md:text-2xl">Medium</option>
                <option value="text-2xl md:text-4xl" selected>Large</option>
                <option value="text-3xl md:text-5xl">Extra Large</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Alignment</label>
              <div class="flex rounded-lg bg-slate-950 p-1 border border-slate-800">
                <button type="button" data-align="text-left" class="align-btn flex-1 py-1 text-center text-xs rounded hover:bg-slate-800 text-slate-400"><i class="fa-solid fa-align-left"></i></button>
                <button type="button" data-align="text-center" class="align-btn flex-1 py-1 text-center text-xs rounded hover:bg-slate-800 text-slate-400 active"><i class="fa-solid fa-align-center"></i></button>
                <button type="button" data-align="text-right" class="align-btn flex-1 py-1 text-center text-xs rounded hover:bg-slate-800 text-slate-400"><i class="fa-solid fa-align-right"></i></button>
              </div>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Text Color</label>
              <div class="flex items-center space-x-2 bg-slate-950 border border-slate-800 rounded-lg p-1">
                <input type="color" id="textColorPicker" value="#1C1917" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent">
                <span id="textColorHex" class="text-[10px] text-slate-400 font-mono">#1C1917</span>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-800">
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Timing & Layout</span>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Duration (Sec)</label>
              <input type="number" id="durationInput" min="2" max="60" value="5" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-lg p-1.5 text-xs text-slate-200">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">Photo Fit</label>
              <select id="objectFitSelect" class="w-full bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-lg p-1.5 text-xs text-slate-200">
                <option value="object-cover">Cover (Fill)</option>
                <option value="object-contain">Contain (Fit)</option>
              </select>
            </div>
          </div>
        </div>

        <button id="replayAnimBtn" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-semibold rounded-xl border border-amber-500/20 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Replay Sound & Animation</span>
        </button>
      </div>
    </div>

    <!-- RIGHT: LIVE REAL-TIME PREVIEW CANVAS -->
    <main id="previewPanel" class="flex-1 flex flex-col items-center justify-center p-3 md:p-6 bg-slate-950 relative overflow-hidden">
      <div class="text-[10px] md:text-xs text-slate-500 font-mono absolute top-2 left-4 flex items-center space-x-2 z-10">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>LIVE PREVIEW</span>
      </div>

      <div class="w-full max-w-2xl h-[75vh] max-h-[600px] bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col relative">
        <div class="h-1/2 w-full bg-slate-900 relative overflow-hidden flex items-center justify-center border-b border-stone-200/20">
          <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover hidden transition-all duration-300">
          <div id="previewImagePlaceholder" class="flex flex-col items-center justify-center text-slate-600">
            <i class="fa-regular fa-image text-2xl mb-1"></i>
            <span class="text-xs">Top 50% Photo Screen</span>
          </div>
        </div>

        <div class="h-1/2 w-full creamy-canvas p-4 md:p-8 flex flex-col justify-center items-center relative overflow-hidden">
          <div id="previewTextContainer" class="w-full max-w-xl text-center text-stone-900 font-serif-elegant text-xl md:text-3xl leading-relaxed tracking-tight">
            <span class="text-stone-400 italic text-sm">Select a slide to preview...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- FULLSCREEN PRESENTATION MODAL -->
  <div id="presentationModal" class="fixed inset-0 bg-black z-50 hidden flex-col">
    <div class="absolute top-0 left-0 right-0 p-3 md:p-4 flex items-center justify-between z-20 bg-gradient-to-b from-black/85 to-transparent">
      <div class="flex items-center space-x-3 text-white">
        <span id="playerSlideCounter" class="text-xs font-mono bg-white/20 backdrop-blur-md px-3 py-1 rounded-full">Slide 1 / 1</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="playerPauseBtn" class="w-8 h-8 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/30 transition">
          <i class="fa-solid fa-pause text-xs"></i>
        </button>
        <button id="closePresentationBtn" class="w-8 h-8 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/30 transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <div class="w-full h-full flex flex-col">
      <div class="h-1/2 w-full bg-black relative flex items-center justify-center overflow-hidden">
        <img id="playerImage" src="" alt="Presentation Photo" class="w-full h-full object-cover">
      </div>

      <div class="h-1/2 w-full creamy-canvas p-6 md:p-12 flex flex-col justify-center items-center relative overflow-hidden">
        <div id="playerTextContainer" class="w-full max-w-3xl text-center"></div>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-stone-300/30">
      <div id="presentationProgressBar" class="h-full bg-amber-600 transition-all duration-100 ease-linear" style="width: 0%;"></div>
    </div>

    <button id="prevSlideBtn" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black/80 transition">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="nextSlideBtn" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black/80 transition">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
